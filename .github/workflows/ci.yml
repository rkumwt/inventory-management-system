name: CI

# Quality gate for every pull request, and for main after a merge.
# Only projects affected by the change are linted, type-checked, tested and
# built (nx affected), so the pipeline stays fast as the monorepo grows.

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read # lets nx-set-shas find the last successful run on main

jobs:
  verify:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Real Postgres and Redis for the integration tests. Each test suite
    # creates its own *_test database, so no init script is needed here.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ims
          POSTGRES_PASSWORD: ims_ci_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ims"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: ims
      DB_PASSWORD: ims_ci_password
      REDIS_URL: redis://localhost:6379
      # Inlined into the frontend bundle by `next build`; validated at build time.
      NEXT_PUBLIC_API_URL: http://localhost:4000/v1

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, needed to compute what is affected

      - name: Set up pnpm
        uses: pnpm/action-setup@v6 # version comes from "packageManager" in package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Sets NX_BASE / NX_HEAD: the PR's base branch for pull requests, or the
      # last successful CI run on main for pushes.
      - name: Derive SHAs for nx affected
        uses: nrwl/nx-set-shas@v5

      - name: Check commit messages
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from "$NX_BASE" --to "$NX_HEAD" --verbose

      - name: Check formatting
        run: pnpm format:check

      - name: Lint, type-check, test and build affected projects
        run: pnpm exec nx affected -t lint typecheck test build --parallel=3

      - name: Integration tests for affected projects
        run: pnpm exec nx affected -t test-int --parallel=1
